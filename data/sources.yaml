  # ----------------------------------------------------------
  # 中国证监会 —— 首个打通的数据源（JSON 接口方案）
  # ----------------------------------------------------------
  - id: csrc-regulations               # 源标识
    issuer_code: csrc                  # 关联机构
    name: 证监会-规章                    # 栏目名称
    tier: primary                      # 官方渠道
    enabled: true                      # 启用
    fetcher: csrc                      # 证监会专用抓取器（JSON 接口 + 站点自检）
    # 列表页地址必须带 channelid 参数：该站的列表数据由 JS 按 channelid 拉取，
    # 不带参数的地址无法定位栏目，也无法作为接口请求的 Referer
    list_url: "https://www.csrc.gov.cn/csrc/c101953/common_list.shtml?channelid=cd11df89f5894c1eac37ae37cc11e369"
    schedule: "0 6 * * *"              # 每日抓取
    min_interval_seconds: 5            # 请求间隔
    pagination:                        # 分页配置（JSON 抓取器主要用 api.page_size 判末页，此处保留作为兜底）
      enabled: true                    # 需要翻页
      max_pages: 3                     # 最多 3 页
      url_pattern: null                # 翻页由 api 参数控制，无需 URL 模板
    selectors: null                    # 该站列表页为 JS 渲染的空壳，HTML 选择器不可用，故为 null
    api:                               # 【关键配置】JSON 接口
      path: "/searchList/{channel_id}" # 接口路径，channel_id 由下方字段填充
      method: GET                      # 该接口为 GET
      channel_id: "cd11df89f5894c1eac37ae37cc11e369"  # 栏目 id（从列表页导航链接中提取）
      params:                          # 请求参数；布尔值必须写成字符串，部分接口不接受 JSON 布尔
        _isAgg: "true"                 # 聚合查询
        _isJson: "true"                # 要求返回 JSON（关键参数，缺省会返回 HTML）
        _pageSize: "18"                # 每页条数；值会同时用于 assembles 请求参数与末页判断
        _template: "index"             # 模板标识
        _rangeTimeGte: ""              # 起始时间过滤，留空表示不限
        _channelName: ""               # 栏目名过滤，留空
        page: "{page}"                 # 页码占位符，由抓取器替换
      items_path: "data.results"       # 条目数组在响应中的位置
      total_path: "data.total"         # 总条数位置（实测该接口返回 total=234）
      field_map:                       # 字段映射：把该站字段名映射到本项目标准字段
        title: "title"                 # 标题字段（实测返回的标题含【第235号令】等前缀，属官方原文，保留不改）
        url: "url"                     # 链接字段
        # 日期字段选择说明：该接口同时返回 publishedTime（epoch 毫秒整数，如 1786847417000）
        # 与 publishedTimeStr（可读字符串 "2026-09-11 18:10:17"）。
        # 本项目选用 epoch 值，因为它不受日期格式变更影响，更稳定；
        # json_search_list.parse_epoch_timestamp 会按北京时间（UTC+8）解释并处理秒/毫秒两种精度。
        date: "publishedTime"          # 日期字段（epoch 毫秒）
      page_size: 18                    # 每页条数，需与 params._pageSize 保持一致
    filters:                           # 过滤规则
      include_keywords:                # 包含关键词
        - 人工智能                       # 主题词
        - 智能                          # 复合词
        - 算法                          # 算法交易相关
        - 科技                          # 科技监管
        - 数据                          # 数据治理
        - 信息技术                       # 信息技术管理
      exclude_keywords:                # 排除关键词
        - 行政处罚                       # 个案处罚（该站目录含大量处罚决定书，噪声主要来源）
        - 市场禁入                       # 个人处分
        - 统计数据                       # 月度统计数据，与政策无关
        - 警示函                        # 监管措施函件
        - 采取出具                        # 「采取出具警示函措施的决定」等个案
    notes: 【已打通的首个数据源，可作为接入其他站点的参考样板】实测结论：①列表页 common_list.shtml 仅约 10 KB 且无列表项，数据由 /searchList/{channelId} 接口返回，共 234 条规章；②接口必须带 _isJson=true，否则返回 HTML；③必须带 Referer 指向列表页，否则可能被拒；④宽泛 HTML 选择器会抓到页脚备案号与统计数据链接，且流水线会误报 ok —— 因此本项目新增了结果质量自检（见 json_search_list.py 的 _passes_quality_check）；⑤该站 meta 标签提供 SiteName 自检信号，CsrcFetcher 据此防止被重定向到非预期页面。  # 备注：这是本项目数据源接入的参考样板，新增站点建议照此结构配置

