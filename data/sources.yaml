    tier: primary                      # 官方渠道
    enabled: true                      # 启用：2026-10-05 实测 HTTP 200，解析出 20 条，全部带日期
    fetcher: cac                       # 使用 cac 专用抓取器
    list_url: "https://www.cac.gov.cn/wxzw/zcfg/bmgz/A09370303index_1.htm"  # 政策法规→部门规章列表页
    schedule: "0 6 * * *"              # 每日抓取
