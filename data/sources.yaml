        # 但旧词表只有「信息技术」，匹配不上「网络和信息安全」，因此长期被漏检。
        #
        # 实测依据：把本栏目被丢弃的 143 条标题逐条扫过，
        # 指向科技/数据/网络治理的共 12 条，其中只有这 1 条真正相关
        # （其余 6 条是「信息披露」类——那是面向投资者的披露义务，不是数据治理；
        #   3 条是「证券登记结算」「基金托管」——与 AI 无关）。
        # 加入「网络」后新增放行 1 条、零噪声。
        - 网络                          # 【2026-10-05 新增】命中《证券期货业网络和信息安全管理办法》
      exclude_keywords:                # 排除关键词
        - 行政处罚                       # 个案处罚（该站目录含大量处罚决定书，噪声主要来源）
        - 市场禁入                       # 个人处分
        - 统计数据                       # 月度统计数据，与政策无关
        - 警示函                        # 监管措施函件
        - 采取出具                        # 「采取出具警示函措施的决定」等个案
    notes: 【已打通的首个数据源，可作为接入其他站点的参考样板】实测结论：①列表页 common_list.shtml 仅约 10 KB 且无列表项，数据由 /searchList/{channelId} 接口返回，共 234 条规章；②接口必须带 _isJson=true，否则返回 HTML；③必须带 Referer 指向列表页，否则可能被拒；④宽泛 HTML 选择器会抓到页脚备案号与统计数据链接，且流水线会误报 ok —— 因此本项目新增了结果质量自检（见 json_search_list.py 的 _passes_quality_check）；⑤该站 meta 标签提供 SiteName 自检信号，CsrcFetcher 据此防止被重定向到非预期页面。  # 备注：这是本项目数据源接入的参考样板，新增站点建议照此结构配置

