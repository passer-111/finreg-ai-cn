                                       # 这是配置错误最危险的一种：看似配了分页，实则请求不存在的页面。
      max_pages: 1                     # 只抓一页
    selectors:                         # 选择器（配置驱动，无需改代码）
      item: "#loadingInfoPage li"      # 定位到内容容器 #loadingInfoPage 内的 li。
                                       # 为什么不用裸 "li"：该页 38 个 li 中有 13 个是站点导航
                                       # （首页/时政要闻/网信政务/互动服务/热点专题 + 七个子栏目入口），
                                       # 裸 li 会把这 13 条导航一并当作条目，污染结果。
                                       # 为什么不用 "li:has(div.times)"（曾用方案）：它要求条目必须含日期元素，
                                       # 于是一旦某条政策的日期因页面微调而解析不到，该条会被**选择器直接排除**，
                                       # 连进入后续清洗逻辑的机会都没有——这比「被判为导航后剔除」更隐蔽，
                                       # 因为 dropped_navigation 计数不会增加，流水线仍报 ok。
                                       # 改用容器 id 定位后，条目归属由结构决定、与日期是否可解析无关，
                                       # 日期解析失败的政策会保留下来并在 stale 台账中暴露。
      title: "h5 a"                    # 标题链接位于 h5 内
      link: "h5 a"                     # 链接即标题链接本身
      date: "div.times"                # 日期在 div.times 中（格式 YYYY-MM-DD）
                                       # 注意：早期配置写的是 "span"，但该页**没有任何 span**，
