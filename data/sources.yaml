  # 【2026-10-05 重大修正：早期「网络不可达」结论已被推翻】
  #
  # 早期记录写的是「www.cac.gov.cn 在测试环境下超时（http=000）」。实测重跑后证明
  # 这**不是可达性问题，而是 URL 失效问题**：
  #   - 旧配置地址 https://www.cac.gov.cn/zcfg/A093601index_1.htm 返回 **HTTP 404**
  #     （耗时 0.31s，非超时；404 页正文为「您所找的网页不存在！」）
  #   - 站点首页 https://www.cac.gov.cn/ 返回 **HTTP 200**（耗时 0.29s）——站点完全可达
  #   - 真实地址为 /wxzw/zcfg/... 前缀下（网信政务 → 政策法规），栏目 ID 也已变更
  #   - 因此「超时」的上报极可能是把「请求了一个不存在的路径后被站点防护拦下/重试」
  #     误读成了「网络不通」。教训：http=000 时必须先分清「域名不可达」「路径不存在」
  #     「被拦截」三种情况，否则会把一个改 URL 就能修的问题误判成无解的运维问题。
  #
  # 按栏目拆成三个源，而非一个——因为网信办把不同类型的文件放在不同栏目，
  # 各栏目历史全量都只有 15~20 条（无分页），合计覆盖了 AI 合规的全部核心法规。
  # 三者内容互补，缺任何一个都会出现盲区。
