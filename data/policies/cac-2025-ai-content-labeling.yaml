# ---- 适用主体 ----
applicable_to:                                         # 原文明确的适用主体
  - 网络信息服务提供者                                   # 开展标识活动的服务提供者
  - 提供网络信息内容传播服务的服务提供者                  # 传播平台
  - 互联网应用程序分发平台                                # 应用分发平台

# ---- 关键义务 ----
key_obligations:
  - clause: 第四条                                       # 条款定位
    summary: 对文本、音频、图片、视频、虚拟场景等生成合成内容添加显式标识；提供下载、复制、导出功能时须确保文件含有满足要求的显式标识
    obligation_type: mandatory                          # 强制性要求
    tags:
      - content-labeling                                # 内容标识

  - clause: 第五条                                       # 条款定位
    summary: 须在文件元数据中添加隐式标识，包含生成合成内容属性信息、服务提供者名称或编码、内容编号等制作要素信息
    obligation_type: mandatory                          # 强制性要求
    tags:
      - content-labeling                                # 隐式标识
      - disclosure                                      # 溯源信息

  - clause: 第六条                                       # 条款定位
    summary: 传播平台须核验文件元数据中的隐式标识；未核验到隐式标识但用户声明或检测到生成痕迹的，须在内容周边添加「可能/疑似生成合成内容」提示标识
    obligation_type: mandatory                          # 强制性要求
    tags:
      - content-labeling                                # 平台核验义务
      - disclosure                                      # 提示标识

  - clause: 第七条                                       # 条款定位
    summary: 互联网应用程序分发平台在上架或上线审核时，应要求服务提供者说明是否提供生成合成服务，并提供者须核验其标识相关材料
    obligation_type: requires-assessment                # 需开展核验
    tags:
      - content-labeling                                # 应用分发审核
      - supervision-and-reporting                       # 审核义务

  - clause: 第八条                                       # 条款定位
    summary: 须在用户服务协议中明确说明生成合成内容标识的方法、样式等规范内容，并提示用户阅读理解标识管理要求
    obligation_type: mandatory                          # 强制性要求
    tags:
      - disclosure                                      # 协议披露
      - consumer-protection                             # 用户知情

  - clause: 第九条                                       # 条款定位
    summary: 用户申请无显式标识内容时，须通过用户协议明确用户的标识义务与使用责任，并依法留存提供对象信息等相关日志不少于六个月
    obligation_type: requires-recordkeeping             # 需留存记录
    tags:
      - content-labeling                                # 无标识内容管理
      - disclosure                                      # 日志留存

  - clause: 第十条                                       # 条款定位
    summary: 任何组织和个人不得恶意删除、篡改、伪造、隐匿标识，不得为他人实施上述行为提供工具或服务
    obligation_type: prohibition                        # 禁止性要求
    tags:
      - content-labeling                                # 标识防篡改
      - cybersecurity                                   # 安全防护

  - clause: 第十二条                                     # 条款定位
    summary: 在履行算法备案、安全评估等手续时，须按本办法提供生成合成内容标识相关材料，并加强标识信息共享
    obligation_type: requires-reporting                 # 需提交材料
    tags:
      - algorithm-filing                                # 算法备案衔接
      - supervision-and-reporting                       # 监管报送

# ---- 其它 ----
language: zh-CN                                        # 正文语言
tags:                                                  # 自由标签
  - 网信办                                             # 便于按机构检索
  - 四部门联合发布                                       # 发文形式
  - 强制性国家标准配套                                   # 有配套国标《网络安全技术 人工智能生成合成内容标识方法》
notes: 本办法配套发布了强制性国家标准《网络安全技术 人工智能生成合成内容标识方法》，由市场监管总局、国家标准管理委员会批准发布。四部门为国家互联网信息办公室、工业和信息化部、公安部、国家广播电视总局。通知落款日期为 2025 年 3 月 7 日，公开报道日期为 2025 年 3 月 14 日，本记录 published_on 取后者（公开可查证的发布时点）。对金融机构的实际影响：面向客户展示的 AI 生成营销材料、投研报告、客服回复均需添加显式标识，且需在文件元数据中嵌入隐式标识。
