id: cac-2025-ai-content-labeling                        # 唯一标识
title: 人工智能生成合成内容标识办法                       # 官方全称
title_en: null                                          # 未查到官方英文版
issuer: 国家互联网信息办公室、工业和信息化部、公安部、国家广播电视总局  # 四部门联合发布
issuer_code: cac                                        # 主发文机关代码（网信办牵头）
doc_number: 国信办通字〔2025〕2号                          # 官方发文字号

# ---- 法域 ----
jurisdiction: CN                                        # 法域：中国大陆
jurisdiction_detail: null                               # 国家层面文件

# ---- 效力判断 ----
instrument_type: 部门规范性文件                           # 层级：四部门联合印发的规范性文件
bindingness: binding                                    # 约束力：产生强制义务，违反由网信、电信、公安、
                                                        # 广播电视等主管部门依法处理（见第十三条）
ai_relevance: core                                      # 相关度：主体内容即为 AI 生成内容的标识规范

# ---- 所属领域与主题 ----
domain:                                                # 所属领域
  - 人工智能                                             # AI 领域
  - 金融                                                # 金融场景强相关（对客内容合规）
  - 数据                                                # 涉及元数据与内容治理
topics:                                                # 主题标签
  - content-labeling                                    # 内容标识（核心主题）
  - deep-synthesis                                      # 深度合成
  - disclosure                                          # 透明度与信息披露
  - consumer-protection                                 # 消费者保护

# ---- 时效性 ----
status: effective                                       # 当前状态：现行有效
