# ============================================================
# 政策记录：人工智能生成合成内容标识办法
# ------------------------------------------------------------
# 金融机构对客服务中若使用 AI 生成内容（营销文案、客服话术、
# 投研摘要），即落入本办法约束范围。这是「AI 生成内容必须打标」
# 的直接法律依据，也是金融消费者保护的前置要求。
#
# 记录特点：印发日期与公开发布日期不同，本记录同时保留了
# 通知落款日期与媒体公开报道日期，避免后续核验时产生混淆。
# ============================================================

