# ============================================================
# 政策记录：关于规范金融业开源技术应用与发展的意见
# ------------------------------------------------------------
# 为何这条记录重要：金融监管总局 2026 年的 AI 指导意见明确引用了
# 开源技术管理与供应链安全要求，而这条 2021 年的文件是那个要求的
# 制度源头。理解这条文件，才能理解 2026 年新规的立法意图。
#
# 这也是本项目「上位依据链」价值的一个示例——
# 孤立看一条政策，往往看不出它为什么这样规定。
# ============================================================

