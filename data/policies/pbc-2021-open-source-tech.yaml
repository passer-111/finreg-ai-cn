# ---- 适用主体 ----
applicable_to:                                   # 原文明确的适用主体
  - 金融机构                                      # 全部持牌金融机构

# ---- 关键义务 ----
key_obligations:
  - clause: 二                                     # 条款定位
    summary: 金融机构使用开源技术应坚持安全可控、合规使用、问题导向、开放创新四项原则，开展事前技术评估和安全评估
    obligation_type: requires-assessment           # 需开展评估
    tags:
      - open-source-management                     # 开源治理原则
      - cybersecurity                              # 安全评估

  - clause: 五                                     # 条款定位
    summary: 应建立健全开源技术应用管理制度体系，规范引入审批、技术评估、合规使用、漏洞检测、更新维护、应急处置、停用退出等行为
    obligation_type: mandatory                     # 强制性要求
    tags:
      - open-source-management                     # 管理制度
      - supply-chain                               # 全流程管理

  - clause: 七                                     # 条款定位
    summary: 应建立开源技术应用台账，及时掌握开源许可证变更、漏洞、闭源、停服等变化情况，实行常态化管理
    obligation_type: requires-recordkeeping        # 需留存台账
    tags:
      - open-source-management                     # 应用台账
      - supervision-and-reporting                  # 常态化管理

  - clause: 十                                     # 条款定位
    summary: 应对开源技术版权、专利、商标、声明等进行事前合规审查，通过审查许可证遵从性与兼容性、梳理依赖关系，避免法律纠纷
    obligation_type: requires-assessment           # 需合规审查
    tags:
      - open-source-management                     # 许可证合规

  - clause: 十一                                   # 条款定位
    summary: 应制定应急处置预案，应对开源技术潜在漏洞、后门及闭源、停服等突发情况，并定期开展演练
    obligation_type: mandatory                     # 强制性要求
    tags:
      - supply-chain                               # 应急处置
      - business-continuity                        # 业务连续性

  - clause: 十二                                   # 条款定位
    summary: 应加强开源技术供应链管理，通过合同或协议条款明确开源技术提供商的义务和责任
    obligation_type: mandatory                     # 强制性要求
    tags:
      - supply-chain                               # 供应链合同
      - outsourcing                                # 第三方责任

# ---- 其它 ----
language: zh-CN                                  # 正文语言
tags:                                            # 自由标签
  - 人民银行牵头                                   # 发文机关特征
  - 五部门联合发布                                  # 发文形式
  - 上位依据                                      # 标注其作为后续规定依据的地位
notes: 共二十条。发布机关中「中国银行保险监督管理委员会」已于 2023 年改组为国家金融监督管理总局，但本文件署名沿用原机构名称，本记录按官方原文保留「中国银行保险监督管理委员会」。与 AI 合规的关联点：金融机构引入的开源大模型、推理框架、向量库、Agent 框架均属本办法界定的「开源技术」，因此第七条的开源软件管理台账义务、第十条的许可证合规审查义务直接覆盖 AI 技术栈。2026 年金融监管总局 AI 指导意见第十九条要求「建立开源软件管理台账，对外部引入的开源组件应进行审查评估，防范供应链投毒」，即是对本办法要求的延续与强化。
