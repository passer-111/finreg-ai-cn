# ============================================================
# 政策记录：生成式人工智能服务管理暂行办法
# ------------------------------------------------------------
# 这是中国生成式 AI 监管的基础性部门规章，也是金融机构部署
# 大模型应用时最常被引用的合规依据。金融监管总局 2026 年 AI
# 指导意见中「外部引入的生成式人工智能模型需经过网信部门备案」
# 这一要求，其制度依据即来自本办法。
# ============================================================

