# ---- 适用主体 ----
applicable_to:                         # 原文明确的适用机构类型
  - 各金融监管局                       # 监管派出机构（监督主体）
  - 政策性银行                         # 适用银行类型
  - 大型银行                           # 适用银行类型
  - 股份制银行                         # 适用银行类型
  - 外资银行                           # 适用银行类型
