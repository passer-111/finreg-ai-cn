  - model-risk                         # 模型风险
  - high-risk-ai                       # 高风险 AI 应用
  - human-oversight                    # 人工监督与干预
  - explainability                     # 可解释性
  - bias-and-fairness                  # 公平性与反歧视
  - data-security                      # 数据安全
  - personal-information               # 个人信息保护
  - data-quality                       # 数据质量
  - outsourcing                         # 外包风险
  - open-source-management             # 开源技术管理
  - supply-chain                       # 供应链风险
  - cybersecurity                      # 网络安全
  - prompt-injection                   # 提示词注入防护
  - business-continuity                # 业务连续性
  - ethics-review                      # 伦理审查
  - disclosure                         # 透明度与信息披露
  - computing-power                    # 智能算力建设
  - supervision-and-reporting          # 监管报告义务

