# ============================================================
# 政策记录：关于银行业保险业人工智能安全开发应用的指导意见
# ------------------------------------------------------------
# 这是本项目的旗舰记录，也是金融领域 AI 合规最直接的纲领性文件。
# 2026-06-18 由国家金融监督管理总局发布，共三十二条。
#
# 之所以选它作为第一条记录：它同时具备
#   1) 明确的发布机构与日期（易于核验）
#   2) 直接针对金融场景（区别于通用 AI 法规）
#   3) 大量「须」「不得」「严禁」表述（约束力判断有实质意义）
#   4) 含具体的高风险应用准入要求（可提炼为可执行义务）
# 这三十二条几乎覆盖了金融机构部署 AI 时需要回答的全部合规问题。
#
# 字段结构定义见 schema/policy.schema.json
# ============================================================

