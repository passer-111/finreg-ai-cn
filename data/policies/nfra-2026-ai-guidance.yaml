  - 理财公司                           # 适用机构类型
  - 保险集团（控股）公司                 # 适用保险机构类型
  - 保险公司                           # 适用保险机构类型
  - 保险资产管理公司                    # 适用保险机构类型
  - 金融控股公司                       # 适用机构类型

# ---- 关键义务（人工提炼，每条均可回源核对） ----
key_obligations:

  - clause: （一）                       # 原文条款定位
    summary: 董（理）事会应指定专门委员会对人工智能开发应用管理负责，统筹制定发展规划、明确牵头部门与跨业务协同机制
    obligation_type: mandatory          # 义务类型：强制性要求
    tags:                               # 涉及主题
      - ai-governance                   # 治理架构

  - clause: （二）                       # 条款定位
    summary: 应建立覆盖需求分析、数据准备、训练开发、部署运行、维护迭代、评估退出的全生命周期管理体系
    obligation_type: mandatory          # 强制性要求
    tags:
      - ai-governance                   # 全生命周期管理
      - model-risk                      # 模型风险

  - clause: （五）                       # 条款定位
    summary: 外部引入的生成式人工智能模型需经过网信部门备案；对生成式模型实施准入管理并评估效能与安全合规性
    obligation_type: requires-approval  # 义务类型：需前置审批/备案
    tags:
      - model-risk                      # 模型准入
      - supervision-and-reporting       # 监管备案

  - clause: （十五）                     # 条款定位
    summary: 应按业务场景重要性、应用规模、对客影响度、模型依赖度、模型复杂度对 AI 应用风险识别与分类分级，建立管理制度并制定应用清单
    obligation_type: requires-assessment # 义务类型：需开展评估
    tags:
      - high-risk-ai                    # 风险分级
      - model-risk                      # 模型风险

  - clause: （十六）                     # 条款定位
    summary: 涉及资金交易、资产评估、信贷审批、承保理赔、风险管理等场景的生成式 AI 应用视为高风险应用，须经本机构风险管理委员会批准后方可实施
    obligation_type: requires-approval  # 义务类型：需前置审批
    tags:
      - high-risk-ai                    # 高风险应用
      - ai-governance                   # 治理架构

  - clause: （十七）                     # 条款定位
    summary: 高风险应用关键环节须建立人工监督与干预机制，明确紧急停用及模型退出条件，建立备用系统或人工替代流程
    obligation_type: mandatory          # 强制性要求
    tags:
      - human-oversight                 # 人工监督
      - business-continuity             # 业务连续性

  - clause: （十八）                     # 条款定位
    summary: 使用外部 AI 技术时须在外包策略、数据安全、集中度管理方面建立机制，对外包合作机构实行名单制管理
    obligation_type: mandatory          # 强制性要求
    tags:
      - outsourcing                     # 外包管理
      - supply-chain                    # 供应链

  - clause: （十九）                     # 条款定位
    summary: 须建立 AI 算力、模型、数据、技术工具的供应链安全合规管理机制；完善开源技术使用规范、建立开源软件管理台账，对外部引入组件审查评估并防范供应链投毒
    obligation_type: mandatory          # 强制性要求
    tags:
      - open-source-management          # 开源管理
      - supply-chain                    # 供应链

  - clause: （二十一）                    # 条款定位
    summary: 应对 AI 生成内容进行显著标识并向金融消费者主动说明；加强模型开发、变更管理和训练过程记录，日志保存期限不低于业务存续期
    obligation_type: requires-recordkeeping  # 义务类型：需留存记录
    tags:
      - disclosure                      # 内容标识与说明
      - consumer-protection             # 金融消费者保护

  - clause: （二十二）                    # 条款定位
    summary: 可解释性不足的 AI 在高风险场景仅能作为辅助工具，须由人工最终决策并设置人工复核节点；须完整保留原始数据、推理路径及阈值触发记录以确保责任可追溯
    obligation_type: mandatory          # 强制性要求
    tags:
      - explainability                  # 可解释性
      - human-oversight                 # 人工决策
      - disclosure                      # 责任追溯

  - clause: （二十三）                    # 条款定位
    summary: 应建立 AI 开发应用伦理审查监测制度，制定伦理行为准则，加强数据集审查与对特定群体的影响评估，避免算法歧视
    obligation_type: requires-assessment # 义务类型：需开展评估
    tags:
      - ethics-review                   # 伦理审查
      - bias-and-fairness               # 公平性

  - clause: （二十四）                    # 条款定位
    summary: 姓名、身份证号、手机号、银行卡号等个人信息和隐私数据不得用于生成式人工智能模型训练和优化；须加强模型安全护栏与内容过滤脱敏
    obligation_type: prohibition        # 义务类型：禁止性要求
    tags:
      - personal-information            # 个人信息保护
      - data-security                   # 数据安全

  - clause: （二十五）                    # 条款定位
    summary: 须防范提示词注入、思维链注入、多模态攻击、上下文污染等威胁；提升智能体系统安全保障能力，防范数据泄露、记忆污染、身份越权、工具滥用、运行失控
    obligation_type: mandatory          # 强制性要求
    tags:
      - prompt-injection                # 提示词注入
      - cybersecurity                   # 网络安全

  - clause: （二十九）                    # 条款定位
    summary: 面向公众服务或高风险场景使用生成式 AI 的，应向金融监管总局或其派出机构报告
    obligation_type: requires-reporting # 义务类型：需向监管报告
    tags:
      - supervision-and-reporting       # 监管报告

# ---- 其它 ----
language: zh-CN                        # 正文语言
tags:                                  # 自由标签（与受控词表 topics 分开管理）
  - 金融监管总局                         # 便于按机构快速检索
  - 银行业保险业                         # 适用行业
  - 纲领性文件                           # 标注其在本领域中的定位
notes: 指导意见共三十二条，分八个部分：总体要求、完善人工智能治理架构、推进高水平人工智能开发应用、提升数据治理能力、加强智能算力建设、完善人工智能风险治理框架、提升人工智能安全开发应用能力、保障与监督。文中明确「坚持以谁使用谁负责，压实金融机构主体责任」，并将高风险场景的判定标准具体化为「涉及资金交易、资产评估、信贷审批、承保理赔、风险管理等，以及与客户利益直接相关、直接影响金融合约达成的生成式人工智能场景」——这是目前金融监管文件中关于 AI 高风险场景最明确的操作性定义，对合规判断价值极高。
