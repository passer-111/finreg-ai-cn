# ---- 适用主体 ----
applicable_to:                                   # 原文明确的适用主体
  - 利用人工智能技术向境内公众提供模拟自然人人格特征、思维模式和沟通风格的持续性情感互动服务的服务提供者  # 主要适用主体

# ---- 关键义务 ----
key_obligations:
  - clause: 安全评估报告提交义务                     # 条款定位（具体条号待核验）
    summary: 出现以下情形须进行安全评估并向所在地省级网信部门提交安全评估报告：①上线拟人化互动服务或增设相关功能；②使用新技术新应用导致服务重大变化；③注册用户 100 万以上或月活跃用户 10 万以上；④存在可能影响国家安全、公共利益等安全风险
    obligation_type: requires-reporting            # 需提交报告
    tags:
      - supervision-and-reporting                  # 安全评估报告

  - clause: 服务目标禁止                         # 条款定位（具体条号待核验）
    summary: 不得将替代社会交往、控制用户心理、诱导沉迷依赖等作为服务目标，并应采取有效措施提示用户正在与人工智能而非自然人互动
    obligation_type: prohibition                   # 禁止性要求
    tags:
      - disclosure                                 # 交互对象提示
      - consumer-protection                        # 用户保护

  - clause: 年龄核验义务                         # 条款定位（具体条号待核验）
    summary: 应当在注册或功能激活环节嵌入年龄核验机制，绝对禁止向未成年人提供虚拟亲密关系服务
    obligation_type: prohibition                   # 禁止性要求
    tags:
      - consumer-protection                        # 未成年人保护

  - clause: 极端情绪干预义务                       # 条款定位（具体条号待核验）
    summary: 发现用户出现极端情绪的，应及时生成情绪安抚和鼓励寻求帮助等内容；发现用户面临或已遭受重大财产损失、明确表示实施自残自杀等极端情境的，应采取援助等必要措施干预并及时联络其监护人或紧急联系人
    obligation_type: mandatory                     # 强制性要求
    tags:
      - consumer-protection                        # 危机干预（含财产损失情形）

# ---- 其它 ----
language: zh-CN                                  # 正文语言
tags:                                            # 自由标签
  - 网信办                                       # 发文机关
  - 需补日期与链接                                 # 标记记录不完整
  - 适用性存疑                                     # 标注需判断是否适用于自身业务
notes: 【适用性判断对本条记录最为关键】本办法明确将「一般性的智能客服、知识问答、工作助手类服务」排除在适用范围之外，理由是这些服务不涉及持续性情感互动。因此：①绝大多数金融机构的标准智能客服不适用本办法；②但若金融机构的投顾助手采用拟人化人设、持续陪伴式交互设计（如「AI 理财伙伴」「AI 投资教练」），则可能被认定落入适用范围；③办法中的「注册用户 100 万以上或月活跃用户 10 万以上」触发安全评估，对大型金融机构的 App 用户规模而言门槛较低，一旦适用即需履行报告义务；④极端情绪干预条款特别提到「面临或已遭受重大财产损失」的情形，与金融业务场景直接相关。建议金融机构在评估时重点关注自家 AI 助手的产品定位表述，而非仅看技术实现。
