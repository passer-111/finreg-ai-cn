# ============================================================
# 政策记录：人工智能拟人化互动服务管理暂行办法
# ------------------------------------------------------------
# 对金融机构的直接相关性：本办法明确排除了「一般性的智能客服、
# 知识问答、工作助手类服务」，因此绝大多数金融客服 AI 不适用。
# 但智能投顾若采用陪伴式、情感化的交互设计，则可能落入适用范围。
#
# 这条记录展示了 topics 与 ai_relevance 字段的价值：
# 用户可以用 `finreg list --ai-relevance related --topic consumer-protection`
# 快速筛出「与金融客服相关但不适用本办法」的政策，避免误判合规义务。
# ============================================================

