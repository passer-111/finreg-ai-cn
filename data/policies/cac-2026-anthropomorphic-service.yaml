ai_relevance: related                            # 相关度：主体为拟人化情感互动服务，
                                                 # 与金融客服 AI 部分交叉（明确的排除条款使其相关度降为 related）
domain:                                          # 所属领域
  - 人工智能                                      # AI 领域
  - 消费者权益                                    # 用户保护
  - 金融                                         # 金融场景部分相关（智能投顾）
topics:                                          # 主题标签
  - consumer-protection                          # 用户保护（核心主题）
  - supervision-and-reporting                     # 安全评估报告
  - content-labeling                             # 与 AI 互动的提示标识
  - disclosure                                   # 服务目标约束

