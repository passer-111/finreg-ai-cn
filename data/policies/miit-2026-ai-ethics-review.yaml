# ---- 适用主体 ----
applicable_to:                                          # 原文明确的适用主体
  - 从事人工智能科技活动的高等学校                        # 责任主体
  - 从事人工智能科技活动的科研机构                        # 责任主体
  - 从事人工智能科技活动的医疗卫生机构                    # 责任主体
  - 从事人工智能科技活动的企业                            # 责任主体（金融机构适用）

# ---- 关键义务 ----
key_obligations:
  - clause: 第三条                                       # 条款定位
    summary: 开展 AI 科技活动应将科技伦理要求贯穿全过程，遵循增进人类福祉、尊重生命权利、坚持公平公正、合理控制风险、保持公开透明、保护隐私安全、确保可控可信七项原则
    obligation_type: mandatory                          # 强制性要求
    tags:
      - ethics-review                                   # 伦理原则

  - clause: 第九条                                       # 条款定位
    summary: 从事 AI 科技活动的企业等是本单位伦理审查管理的责任主体，应设立人工智能科技伦理委员会，配备工作人员、场所和经费，并保障委员会独立开展工作
    obligation_type: mandatory                          # 强制性要求
    tags:
      - ai-governance                                   # 治理架构
      - ethics-review                                   # 伦理委员会

  - clause: 第十条                                       # 条款定位
    summary: 鼓励地方依托相关单位建立专业化的人工智能科技伦理审查与服务中心，面向社会提供审查、复核、培训、咨询等第三方服务
    obligation_type: encouraged                         # 鼓励性条款
    tags:
      - ethics-review                                   # 第三方服务

  - clause: 第五条                                       # 条款定位
    summary: 推进 AI 科技伦理服务体系建设，强化风险监测预警、检测评估、认证、咨询等服务供给，加大对中小微企业伦理审查的支持和服务力度
    obligation_type: encouraged                         # 鼓励性条款（对中小金融机构是政策利好）
    tags:
      - ethics-review                                   # 服务体系

  - clause: 附件（高风险活动清单）                         # 条款定位：附件形式
    summary: 三类 AI 科技活动须经专家复核：①对人类主观行为、心理情绪和生命健康有较强影响的人机融合系统研发；②具有舆论社会动员能力和社会意识引导能力的算法模型、应用程序及系统研发；③面向存在安全、人身健康风险等场景的具有高度自主能力的自动化决策系统研发
    obligation_type: requires-assessment                # 需专家复核
    tags:
      - high-risk-ai                                    # 高风险清单
      - ethics-review                                   # 专家复核

  - clause: 第二十六条                                    # 条款定位
    summary: AI 科技活动在深度合成、算法推荐、生成式 AI 服务管理等方面已实行登记、备案、行政审批且将伦理要求作为审批条件的，可不再开展专家复核
    obligation_type: null                              # 该条为减负条款，非新增义务
    tags:
      - algorithm-filing                                # 备案衔接
      - supervision-and-reporting                       # 监管协同

  - clause: 跟踪审查条款                                  # 条款定位（具体条号待核验）
    summary: 委员会或服务中心对批准的 AI 科技活动开展跟踪审查，间隔一般不超过 12 个月；纳入复核清单的活动间隔一般不超过 6 个月
    obligation_type: requires-assessment                # 需持续跟踪审查
    tags:
      - ethics-review                                   # 跟踪审查
      - supervision-and-reporting                       # 持续监管

  - clause: 第三十二条                                    # 条款定位
    summary: 违反本办法的，依照网络安全法、数据安全法、个人信息保护法、科学技术进步法等法律法规调查处理并给予相应处罚
    obligation_type: mandatory                          # 强制性要求（法律责任）
    tags:
      - supervision-and-reporting                       # 法律责任

# ---- 其它 ----
language: zh-CN                                         # 正文语言
tags:                                                   # 自由标签
  - 工信部牵头                                           # 发文机关特征（纠正过早期误记）
  - 十部门联合发布                                        # 发文形式
  - 伦理审查                                            # 核心机制
  - 待补链接                                            # 标记该记录尚不完整，便于检索待办
notes: 办法共六章三十七条，另附高风险活动专家复核清单。十部门为工业和信息化部、国家发展改革委、教育部、科技部、农业农村部、国家卫生健康委、中国人民银行、国家网信办、中国科学院、中国科协——其中中国人民银行参与联署，是本办法对金融机构具有直接相关性的依据。对金融 AI 合规的实质影响：①金融机构作为「从事人工智能科技活动的企业」需设立 AI 科技伦理委员会；②面向存在人身健康或安全风险场景的高度自主决策系统（如自动信贷审批、自动理赔）研发可能落入专家复核清单；③第二十六条提供了减负通道——若相关 AI 活动已按生成式 AI 或算法推荐规定完成备案且审批条件包含伦理要求，可免于重复专家复核。此条对已备案的金融大模型应用是重要的合规成本优化空间。
