# ============================================================
# 政策记录：互联网信息服务算法推荐管理规定
# ------------------------------------------------------------
# 中国 AI 监管体系的最早一块基石（2022-03 施行），也是后续
# 深度合成、生成式 AI、内容标识等一系列规定的上位依据。
# 其中「算法备案」制度即由此确立，是金融机构使用算法
# 进行个性化推荐时必须评估的合规前置条件。
# ============================================================

