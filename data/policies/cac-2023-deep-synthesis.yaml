notes: 共二十五条。第二条界定的深度合成技术范围包括利用生成合成类算法制作文本、图像、音频、视频、虚拟场景等信息的技术，具体涵盖文本生成、语音生成、音乐生成、图像生成、虚拟人物生成等。对金融机构的意义：①若使用语音合成技术生成客服语音，或使用虚拟数字人提供服务，均落入本规定适用范围；②第十七条的显著标识要求，在标注「具有生成或显著改变信息内容功能」的场景时即触发，是《人工智能生成合成内容标识办法》的立法基础；③第十九条关于人脸、人声编辑需取得被编辑个人单独同意的要求，对涉及身份核验、视频双录的金融业务有直接影响。本规定已由 2025 年施行的《人工智能生成合成内容标识办法》在标识方面作了进一步细化。
