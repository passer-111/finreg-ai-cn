  - 深度合成服务技术支持者                          # 技术支持方同样适用

# ---- 关键义务 ----
key_obligations:
  - clause: 第十四条                               # 条款定位
    summary: 深度合成服务提供者和技术支持者应当加强训练数据管理，采取必要措施保障训练数据安全；训练数据包含个人信息的，应当遵守法律、行政法规有关个人信息保护的规定
    obligation_type: mandatory                     # 强制性要求
    tags:
      - data-quality                               # 训练数据管理
      - personal-information                       # 个人信息保护

  - clause: 第十六条                               # 条款定位
    summary: 深度合成服务提供者应当依法履行算法备案手续，在提供对公众服务前进行安全评估
    obligation_type: requires-reporting            # 需备案与评估
    tags:
      - algorithm-filing                           # 算法备案
      - supervision-and-reporting                   # 安全评估

  - clause: 第十七条                               # 条款定位
    summary: 提供智能对话、合成人声、人脸生成、沉浸式拟真场景等具有生成或显著改变信息内容功能服务的，应当进行显著标识，避免公众混淆或误认
    obligation_type: mandatory                     # 强制性要求
    tags:
      - content-labeling                           # 显著标识（后续标识办法的依据）

  - clause: 第十八条                               # 条款定位
    summary: 不得删除、篡改、隐匿深度合成标识；不得利用技术手段删除、篡改、隐匿标识
    obligation_type: prohibition                   # 禁止性要求
    tags:
      - content-labeling                           # 标识完整性

  - clause: 第十九条                               # 条款定位
    summary: 提供人脸、人声等生物识别信息编辑功能的，应当提示深度合成服务使用者依法告知被编辑的个人并取得其单独同意
    obligation_type: mandatory                     # 强制性要求
    tags:
      - personal-information                       # 生物识别信息单独同意

  - clause: 第二十条                               # 条款定位
    summary: 深度合成服务提供者应当建立健全用于识别违法和不良信息的特征库，完善入库标准、规则和程序，记录并留存相关日志信息
    obligation_type: requires-recordkeeping        # 需留存记录
    tags:
      - supervision-and-reporting                  # 特征库与日志

# ---- 其它 ----
language: zh-CN                                  # 正文语言
