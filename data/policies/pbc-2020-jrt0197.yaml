notes: 层级归类说明同 JR/T 0171：金融行业标准暂归「其他」。与 AI 合规的连接点：本标准给出金融数据安全分级（1 至 5 级）的判定规则，是金融机构判断「某类数据能否进入模型训练语料」的量化依据——分级越高，进入训练流程所需的安全措施越严格。
