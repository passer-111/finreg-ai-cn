notes: 共七十四条。与 AI 合规的连接点：第二十四条要求利用个人信息进行自动化决策时保证决策透明与结果公平公正，不得进行不合理差别待遇，并赋予个人要求说明与拒绝仅通过自动化决策作出决定的权利——金融机构的算法授信、智能定价直接落入该条。文本处理个人信息须以同意等法定事由为基础，约束
  AI 训练数据获取。
