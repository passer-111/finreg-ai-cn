notes: 共五十五条。与 AI 合规的连接点：第二十一条确立数据分类分级保护制度，金融行业据此形成 JR/T 0197 等分级标准，AI 训练数据的定级与管理义务由此派生；第三十条规定重要数据处理者的风险评估义务。
