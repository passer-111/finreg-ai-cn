notes: 关于层级归类的说明：JR/T 为金融行业标准，由人民银行发布，既非「国家标准」也非协会「行业自律规则」，schema 无完全对应项，暂归「其他」；若后续 schema 增设「行业标准」取值，应迁移。与 AI 合规的连接点：该规范将个人金融信息按敏感程度分级（C1/C2/C3），金融机构把客户信息用于模型训练或自动化画像时，其分级结果直接决定可使用的处理方式。
