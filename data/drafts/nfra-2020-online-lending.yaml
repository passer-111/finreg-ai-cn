notes: 共七十条。与 AI 合规的连接点：办法要求互联网贷款的风险模型（授信审批、反欺诈、风险定价）纳入全面风险管理体系，并对合作机构实施名单制管理——金融机构用第三方模型做线上放贷时，本办法是判断「模型外包是否越界」的直接依据。
